# This file is required to allow string extraction for translations.
# Extraction from Python source files
[python: **.py]
encoding = utf-8

# Extraction from Python config files
[python: **.cfg]
encoding = utf-8

# Extraction from Jinja2 templates
[jinja2: **/templates/**.html]
encoding = utf-8
