version: '2.2'
services:
  app:
    build:
      context: ./
      args:
        - ENVIRONMENT=DEV
    image: datasafe-rdm
    restart: "unless-stopped"
    environment:
      - "INVENIO_ACCOUNTS_SESSION_REDIS_URL=redis://cache:6379/1"
      - "INVENIO_BROKER_URL=redis://cache:6379/5"
      - "INVENIO_CACHE_REDIS_URL=redis://cache:6379/0"
      - "INVENIO_CACHE_TYPE=redis"
      - "INVENIO_CELERY_BROKER_URL=redis://cache:6379/5"
      - "INVENIO_CELERY_RESULT_BACKEND=redis://cache:6379/2"
      - "INVENIO_COMMUNITIES_IDENTITIES_CACHE_REDIS_URL=redis://cache:6379/4"
      - "INVENIO_SEARCH_HOSTS=['search:9200']"
      - "INVENIO_SECRET_KEY=CHANGE_ME"
      - "INVENIO_SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://datasafe-rdm:datasafe-rdm@db/datasafe-rdm"
      - "INVENIO_WSGI_PROXIES=2"
      - "INVENIO_RATELIMIT_STORAGE_URL=redis://cache:6379/3"
      - "INVENIO_MAIL_SERVER=mailpit"
      - "INVENIO_MAIL_PORT=1025"
      - "INVENIO_MAIL_SUPPRESS_SEND=False"
      - "INVENIO_SECURITY_EMAIL_SENDER=support@example.org"
      - 'INVENIO_PROXY_FIX_CONFIG={"x_for": 1, "x_proto": 0, "x_host": 0, "x_port": 0, "x_prefix": 0}'
  frontend:
    build: ./docker/nginx/
    image: datasafe-rdm-frontend
    restart: "unless-stopped"
    ports:
      - "80"
      - "443"
  cache:
    image: redis:7
    restart: "unless-stopped"
    read_only: true
    ports:
      - "6379:6379"
  db:
    image: postgres:17
    restart: "unless-stopped"
    environment:
      - "POSTGRES_USER=datasafe-rdm"
      - "POSTGRES_PASSWORD=datasafe-rdm"
      - "POSTGRES_DB=datasafe-rdm"
    ports:
      - "5432:5432"
  pgadmin:
    image: dpage/pgadmin4:6
    restart: "unless-stopped"
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "support@example.org"
      PGADMIN_DEFAULT_PASSWORD: "datasafe-rdm"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
  mailpit:
    image: axllent/mailpit:latest
    restart: "unless-stopped"
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /opt/mailpit/data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - ./docker/mailpit:/opt/mailpit/data
  flower:
    image: mher/flower
    restart: "unless-stopped"
    command: [
      "celery",
      "--broker=redis://cache:6379/5",
      "flower",
    ]
    ports:
      - 5555:5555
  search:
    image: opensearchproject/opensearch:2.19.2
    restart: "unless-stopped"
    environment:
      # settings only for development. DO NOT use in production!
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "discovery.type=single-node"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    ports:
      - "9200:9200"
      - "9600:9600"
  s3:
    image: minio/minio
    restart: "unless-stopped"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
    volumes:
      - ./data:/data
    command: server /data --console-address :9001
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
